[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".pytest_cache",
    "htmlcov",
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "DJ"]
ignore = [
    "E501",    # linha longa — o formatter cuida
    "B008",    # chamadas em argumentos default (padrão Django)
    "RUF012",  # listas mutáveis como atributo de classe (padrão Django)
]

[tool.ruff.lint.per-file-ignores]
"accounts/tests/*" = ["S101"]
